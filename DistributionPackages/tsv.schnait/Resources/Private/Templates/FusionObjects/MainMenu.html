{namespace neos=Neos\Neos\ViewHelpers}
<f:render section="itemList" />

<f:section name="itemList">
  <nav class="tsv-nav" aria-label="Hauptnavigation">
    <a class="tsv-nav__logo" href="{neos:uri.node(node: '~')}">
      <img src="{f:uri.resource(path: 'Images/TSV_Logo.png', package: 'tsv.schnait')}" alt="TSV Schnait 1911 e.V. – Startseite" width="216" height="256">
    </a>

    <button class="tsv-nav__toggle" type="button" aria-expanded="false" aria-controls="tsv-nav-list">
      <span class="tsv-nav__toggle-bars" aria-hidden="true"></span>
      <span class="tsv-nav__toggle-label">Menü</span>
    </button>

    <ul class="tsv-nav__list" id="tsv-nav-list">
      <f:for each="{items}" as="item">
        <li class="tsv-nav__item tsv-nav__item--{item.state}{f:if(condition: item.subItems, then: ' has-children')}">
          <neos:link.node node="{item.node}" class="tsv-nav__link">{item.label}</neos:link.node>
          <f:if condition="{item.subItems}">
            <button class="tsv-nav__subtoggle" type="button" aria-expanded="false" aria-label="Untermenü {item.label} öffnen"></button>
            <f:render section="subList" arguments="{items: item.subItems, level: 2}" />
          </f:if>
        </li>
      </f:for>
    </ul>
  </nav>
</f:section>


<f:section name="subList">
  <ul class="tsv-nav__sub tsv-nav__sub--level{level}">
    <f:for each="{items}" as="item">
      <li class="tsv-nav__item tsv-nav__item--{item.state}{f:if(condition: item.subItems, then: ' has-children')}">
        <neos:link.node node="{item.node}" class="tsv-nav__link">{item.label}</neos:link.node>
        <f:if condition="{item.subItems}">
          <button class="tsv-nav__subtoggle" type="button" aria-expanded="false" aria-label="Untermenü {item.label} öffnen"></button>
          <f:render section="subList" arguments="{items: item.subItems, level: 3}" />
        </f:if>
      </li>
    </f:for>
  </ul>
</f:section>
