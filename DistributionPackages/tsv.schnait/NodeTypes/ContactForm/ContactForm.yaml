##
# A very simple "contactForm" nodetype based on the Neos.Fusion.Form package
#
'tsv.schnait:ContactForm':
  superTypes:
    'Neos.Neos:Content': true
  ui:
    label: 'Kontaktformular'
    icon: 'envelope'
    group: forms
    inspector:
      groups:
        email:
          label: 'E-Mail'
          icon: envelope
          tab: default
        redirect:
          label: 'Weiterleitung'
          icon: share
          tab: default
        message:
          label: 'Meldung'
          icon: comment
          tab: default
  properties:
    subject:
      type: string
      defaultValue: ''
      ui:
        label: 'Betreff'
        inspector:
          group: email
    recipientName:
      type: string
      defaultValue: ''
      ui:
        label: 'Empfänger-Name'
        inspector:
          group: email
    recipientAddress:
      type: string
      defaultValue: ''
      ui:
        label: 'Empfänger-E-Mail'
        inspector:
          group: email
    senderName:
      type: string
      defaultValue: ''
      ui:
        label: 'Absender-Name'
        inspector:
          group: email
    senderAddress:
      type: string
      defaultValue: ''
      ui:
        label: 'Absender-E-Mail'
        inspector:
          group: email
    redirect:
      type: reference
      defaultValue: null
      ui:
        label: 'Weiterleitung zu Seite'
        inspector:
          group: redirect
          editorOptions:
            nodeTypes: ['Neos.Neos:Document']
    message:
      type: string
      defaultValue: ''
      ui:
        label: 'Nachricht'
        inspector:
          group: message
          editor: 'Neos.Neos/Inspector/Editors/TextAreaEditor'
          editorOptions:
            rows: 7